<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARYLINE · Дашборд продавца</title>
<style>
:root{
  --bg:#faf8f6; --surface:#ffffff; --surface-2:#f4efea;
  --border:#e8e1da; --text:#211d1a; --muted:#6b6259; --muted-2:#8f8578;
  --accent:#7a2e3d; --accent-soft:#f3e3e6; --accent-text:#7a2e3d;
  --good:#2f7a4f; --good-soft:#e8f5ec; --good-border:#c7e6d2;
  --warn:#a8752b; --warn-soft:#fbf2e1; --warn-border:#eeddb8;
  --bad:#b23a3a; --bad-soft:#fbeaea; --bad-border:#f0cccc;
  --crit:#7a1f1f; --crit-soft:#f6e2e2; --crit-border:#e6bcbc;
  --shadow: 0 1px 2px rgba(33,29,26,0.04), 0 6px 20px rgba(33,29,26,0.05);
  --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", ui-serif, serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
:root[data-theme="dark"]{
  --bg:#1b1714; --surface:#231e1a; --surface-2:#2a2420;
  --border:#3a322b; --text:#f1eae4; --muted:#a79c90; --muted-2:#8a8074;
  --accent:#d68b9c; --accent-soft:#3a2027; --accent-text:#e6a6b5;
  --good:#6cc191; --good-soft:#1c2c22; --good-border:#2c4636;
  --warn:#e0b064; --warn-soft:#332818; --warn-border:#4d3c22;
  --bad:#e2807f; --bad-soft:#3a2020; --bad-border:#55302f;
  --crit:#f0a3a2; --crit-soft:#3f1f1f; --crit-border:#5c2b2b;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 24px rgba(0,0,0,0.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1714; --surface:#231e1a; --surface-2:#2a2420;
    --border:#3a322b; --text:#f1eae4; --muted:#a79c90; --muted-2:#8a8074;
    --accent:#d68b9c; --accent-soft:#3a2027; --accent-text:#e6a6b5;
    --good:#6cc191; --good-soft:#1c2c22; --good-border:#2c4636;
    --warn:#e0b064; --warn-soft:#332818; --warn-border:#4d3c22;
    --bad:#e2807f; --bad-soft:#3a2020; --bad-border:#55302f;
    --crit:#f0a3a2; --crit-soft:#3f1f1f; --crit-border:#5c2b2b;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 24px rgba(0,0,0,0.35);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  font-size:15px; line-height:1.5;
}
::selection{background:var(--accent-soft); color:var(--accent-text);}
.tabular{font-variant-numeric:tabular-nums;}
a{color:inherit;}

header.top{
  background:linear-gradient(180deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 82%, black) 100%);
  color:#fdf6f2; padding:28px 24px 22px;
}
header.top .inner{max-width:1080px; margin:0 auto;}
header.top .eyebrow{
  font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
  opacity:0.78; margin-bottom:8px;
}
header.top h1{
  font-family:var(--font-display); font-weight:400; font-size:28px; margin:0 0 6px;
  text-wrap:balance;
}
header.top .meta{font-size:13px; opacity:0.82;}

nav.tabs{
  position:sticky; top:0; z-index:10;
  background:var(--bg); border-bottom:1px solid var(--border);
}
nav.tabs .inner{
  max-width:1080px; margin:0 auto; display:flex; gap:4px; padding:0 24px;
  overflow-x:auto;
}
nav.tabs button{
  appearance:none; border:none; background:none; cursor:pointer;
  padding:14px 16px; font-size:14px; font-weight:600; color:var(--muted);
  border-bottom:2px solid transparent; white-space:nowrap; font-family:var(--font-body);
}
nav.tabs button:hover{color:var(--text);}
nav.tabs button.active{color:var(--accent-text); border-bottom-color:var(--accent);}
nav.tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; border-radius:4px;}

main{max-width:1080px; margin:0 auto; padding:24px;}
.panel{display:none;}
.panel.active{display:block;}

.kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:20px;}
.kpi{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:14px 16px; box-shadow:var(--shadow);
}
.kpi .num{font-family:var(--font-display); font-size:26px; font-variant-numeric:tabular-nums;}
.kpi .label{font-size:12px; color:var(--muted); margin-top:4px; line-height:1.35;}
.kpi.good .num{color:var(--good);}
.kpi.warn .num{color:var(--warn);}
.kpi.bad .num{color:var(--bad);}
.kpi.crit .num{color:var(--crit);}
.pill{
  display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700;
  padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:middle;
}
.pill.up{background:var(--bad-soft); color:var(--bad);}
.pill.down{background:var(--good-soft); color:var(--good);}
.pill.flat{background:var(--surface-2); color:var(--muted);}

h2.section-title{
  font-family:var(--font-display); font-weight:400; font-size:20px; margin:28px 0 12px;
}
h2.section-title:first-child{margin-top:0;}

.search-box input{
  width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border);
  font-size:14px; background:var(--surface); color:var(--text); margin-bottom:16px;
  font-family:var(--font-body);
}
.search-box input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

.date-controls{
  display:flex; flex-wrap:wrap; align-items:center; gap:14px;
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:12px 16px; margin-bottom:14px; box-shadow:var(--shadow); font-size:13.5px;
}
.date-controls label{display:flex; align-items:center; gap:6px; color:var(--muted);}
.date-controls input[type="date"]{
  border:1px solid var(--border); border-radius:8px; padding:6px 8px; background:var(--surface-2);
  color:var(--text); font-family:var(--font-body); font-size:13.5px;
}
.date-controls input[type="date"]:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.date-presets{display:flex; gap:6px;}
.preset-btn{
  appearance:none; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--font-body);
}
.preset-btn:hover{border-color:var(--accent);}
.preset-btn:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

.subtabs{display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 14px;}
.subtab-btn{
  appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--muted);
  border-radius:999px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:var(--font-body);
}
.subtab-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.subtab-btn:hover:not(.active){border-color:var(--accent); color:var(--text);}
.subtab-btn:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.subpanel{display:none;}
.subpanel.active{display:block;}
.table-scroll{max-height:600px; overflow:auto; border-radius:10px;}
.table-scroll table{width:max-content; min-width:100%;}
.table-scroll thead th{position:sticky; top:0; background:var(--surface); z-index:1;}

.audit-kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:14px;}
.type-breakdown{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px;}
.type-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 16px; box-shadow:var(--shadow); font-size:13.5px;}
.type-card b{font-size:15px;}
.type-card .muted-text{display:block; margin-top:2px;}

.action-item{display:flex; gap:12px; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); margin-bottom:8px; box-shadow:var(--shadow);}
.prio-badge{flex:none; font-weight:800; font-size:12px; padding:3px 9px; border-radius:999px; height:fit-content;}
.prio-badge.P1{background:var(--crit-soft); color:var(--crit);}
.prio-badge.P2{background:var(--warn-soft); color:var(--warn);}
.prio-badge.P3{background:var(--surface-2); color:var(--muted);}
.action-text{font-size:13.5px; line-height:1.5;}
.action-related{color:var(--muted); font-size:12px; margin-top:3px;}
.action-section{font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted-2); margin:16px 0 6px;}
.action-section:first-child{margin-top:0;}

details.section{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow);
}
details.section > summary{
  list-style:none; cursor:pointer; padding:15px 18px; display:flex; align-items:center;
  justify-content:space-between; font-weight:700; font-size:14.5px; user-select:none;
}
details.section > summary::-webkit-details-marker{display:none;}
details.section > summary:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
.chev{color:var(--muted); font-size:13px; transition:transform .15s ease;}
details[open] > summary .chev{transform:rotate(90deg);}
.section-body{padding:2px 16px 14px; display:flex; flex-direction:column; gap:8px; max-height:520px; overflow-y:auto;}
.section.crit > summary{color:var(--crit);}
.section.bad > summary{color:var(--bad);}
.section.warn > summary{color:var(--warn);}
.section.good > summary{color:var(--good);}
.count-badge{font-weight:800; font-size:12.5px; padding:2px 9px; border-radius:999px; margin-left:8px;}
.crit .count-badge{background:var(--crit-soft); color:var(--crit);}
.bad .count-badge{background:var(--bad-soft); color:var(--bad);}
.warn .count-badge{background:var(--warn-soft); color:var(--warn);}
.good .count-badge{background:var(--good-soft); color:var(--good);}

.item-card{border-radius:10px; border:1px solid var(--border); padding:10px 14px; background:var(--surface-2);}
.item-card.crit{background:var(--crit-soft); border-color:var(--crit-border);}
.item-card.bad{background:var(--bad-soft); border-color:var(--bad-border);}
.item-card.warn{background:var(--warn-soft); border-color:var(--warn-border);}
.item-title{font-weight:700; font-size:14px;}
.item-sub{font-size:12.5px; margin-top:3px; line-height:1.45; color:var(--muted);}
.empty-msg{color:var(--muted); font-size:13.5px; padding:10px 4px;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
table caption{caption-side:top; text-align:left; font-size:12px; color:var(--muted); padding-bottom:8px;}
th{
  text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em;
  color:var(--muted-2); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--border);
  white-space:nowrap;
}
td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
tr:last-child td{border-bottom:none;}
td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}
th.sortable{cursor:pointer; user-select:none; white-space:nowrap;}
th.sortable:hover{color:var(--text);}
th.sortable.active{color:var(--accent-text);}
th.sortable:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
td.drr-good{color:var(--good); font-weight:700;}
td.drr-warn{color:var(--warn); font-weight:700;}
td.drr-bad{color:var(--bad); font-weight:700;}
.table-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:4px 6px; margin-bottom:20px; box-shadow:var(--shadow);}
.rowname{font-weight:600;}
.rowsub{color:var(--muted); font-size:12px; margin-top:2px;}
.tag{font-size:11px; padding:1px 7px; border-radius:999px; font-weight:700;}
.tag.own{background:var(--accent-soft); color:var(--accent-text);}

.cat-block{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:20px; box-shadow:var(--shadow);}
.cat-block h3{font-family:var(--font-display); font-weight:400; font-size:17px; margin:0 0 4px;}
.cat-sub{color:var(--muted); font-size:12.5px; margin-bottom:14px;}

.season-chart{display:flex; align-items:flex-end; gap:4px; height:80px; margin:10px 0 4px;}
.season-bar{flex:1; background:var(--accent); opacity:0.35; border-radius:3px 3px 0 0; position:relative; min-height:2px;}
.season-bar.now{opacity:0.9;}
.season-labels{display:flex; gap:4px; font-size:10px; color:var(--muted-2);}
.season-labels span{flex:1; text-align:center;}

footer{color:var(--muted); font-size:12.5px; padding:8px 24px 40px; max-width:1080px; margin:0 auto;}

@media (max-width:640px){
  header.top h1{font-size:22px;}
  .kpi .num{font-size:21px;}
}
</style>
</head>

function fmtInt(n){ return (n===null||n===undefined) ? '—' : Math.round(n).toLocaleString('ru-RU'); }
function fmtMoney(n){ return (n===null||n===undefined) ? '—' : Math.round(n).toLocaleString('ru-RU') + ' ₽'; }
function fmtPct(n, digits){ if(n===null||n===undefined) return '—'; return n.toFixed(digits===undefined?1:digits) + '%'; }
function esc(s){ return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pill(delta, unit){
  if(delta===null||delta===undefined) return '';
  const up = delta > 0;
  const cls = Math.abs(delta) < 0.05 ? 'flat' : (up ? 'up':'down');
  const arrow = Math.abs(delta) < 0.05 ? '·' : (up ? '↑':'↓');
  return `<span class="pill ${cls}">${arrow} ${Math.abs(delta).toFixed(1)}${unit||''}</span>`;
}

const STOCK_ALERT_THRESHOLD = 15;

function renderStocks(){
  const items = DATA.stocks.items;
  const advertisedSet = new Set((DATA.ads.advertised_nm_ids_yesterday||[]).map(String));
  const nmToCampaigns = DATA.ads.nm_to_campaigns_yesterday || {};

  const notOnSite = items.filter(i => !i.found_on_site);
  const phantom = items.filter(i => i.found_on_site && (i.live_total||0) === 0 && i.api_total > 0);
  const partialLive = items.filter(i => {
    if(!i.found_on_site) return false;
    const sizes = Object.values(i.live_sizes||{});
    if(!sizes.length) return false;
    const zero = sizes.filter(q => q===0).length;
    return zero > 0 && zero < sizes.length;
  });
  const okItems = items.filter(i => {
    if(!i.found_on_site) return false;
    const sizes = Object.values(i.live_sizes||{});
    return sizes.length>0 && sizes.every(q => q>0);
  });
  const lowStockAdvertised = items.filter(i =>
    i.found_on_site && i.live_total!==null && i.live_total < STOCK_ALERT_THRESHOLD && advertisedSet.has(String(i.nm))
  ).sort((a,b) => (a.live_total||0) - (b.live_total||0));

  const kpis = `
    <div class="kpi-row">
      <div class="kpi"><div class="num tabular">${fmtInt(items.length)}</div><div class="label">карточек в кабинете</div></div>
      <div class="kpi crit"><div class="num tabular">${fmtInt(lowStockAdvertised.length)}</div><div class="label">остаток &lt;${STOCK_ALERT_THRESHOLD} шт. + крутится реклама</div></div>
      <div class="kpi crit"><div class="num tabular">${fmtInt(notOnSite.length)}</div><div class="label">не найдено на сайте</div></div>
      <div class="kpi bad"><div class="num tabular">${fmtInt(phantom.length)}</div><div class="label">фантомный остаток: в API есть, на сайте 0</div></div>
      <div class="kpi warn"><div class="num tabular">${fmtInt(partialLive.length)}</div><div class="label">доступны не все размеры</div></div>
      <div class="kpi good"><div class="num tabular">${fmtInt(okItems.length)}</div><div class="label">полностью в наличии</div></div>
    </div>`;

  function skuLabel(i){ return i.vendorCode || String(i.nm); }
  function card(cls, i, sub){
    return `<div class="item-card ${cls}" data-search="${esc((i.nm+' '+skuLabel(i)+' '+i.name).toLowerCase())}">
      <div class="item-title">${esc(skuLabel(i))} — ${esc(i.name)}</div>
      <div class="item-sub">${sub}</div>
    </div>`;
  }

  const secLowStockAds = lowStockAdvertised.map(i => {
    const camps = nmToCampaigns[String(i.nm)] || [];
    const campNames = camps.map(c => esc(c.name)).join(', ') || 'кампания не определена';
    return card('crit', i, `Остаток на сайте: ${i.live_total} шт. Вчера показывалась реклама: ${campNames}. Расход продолжается, а товар почти закончился — проверьте кампанию.`);
  }).join('') || `<div class="empty-msg">Таких карточек сегодня нет — хорошая новость.</div>`;

  const secNotOnSite = notOnSite.map(i => card('crit', i, `В кабинете есть, на сайте карточка не найдена (архив/снята с продажи). По API остаток: ${fmtInt(i.api_total)} шт.`)).join('') || `<div class="empty-msg">Таких карточек нет.</div>`;

  const secPhantom = phantom.map(i => card('bad', i, `КРИТИЧНО: по API остаток ${fmtInt(i.api_total)} шт., но на сайте недоступен ни один размер — товар физически есть, но не продаётся.`)).join('') || `<div class="empty-msg">Таких карточек нет.</div>`;

  const secPartial = partialLive.map(i => {
    const zero = Object.entries(i.live_sizes).filter(([,q])=>q===0).map(([s])=>s);
    return card('warn', i, `На сайте недоступны размеры: ${esc(zero.join(', '))}`);
  }).join('') || `<div class="empty-msg">Таких карточек нет.</div>`;

  const html = kpis + `
    <div class="search-box"><input type="text" id="stockSearch" placeholder="Поиск по артикулу или названию…"></div>

    <details class="section crit" open>
      <summary><span>⚠ Остаток &lt;${STOCK_ALERT_THRESHOLD} шт. и вчера крутилась реклама <span class="count-badge">${lowStockAdvertised.length}</span></span><span class="chev">▶</span></summary>
      <div class="section-body" data-group="lowStockAds">${secLowStockAds}</div>
    </details>

    <details class="section crit">
      <summary><span>Не найдено на сайте <span class="count-badge">${notOnSite.length}</span></span><span class="chev">▶</span></summary>
      <div class="section-body" data-group="notOnSite">${secNotOnSite}</div>
    </details>

    <details class="section bad">
      <summary><span>Фантомный остаток — API врёт <span class="count-badge">${phantom.length}</span></span><span class="chev">▶</span></summary>
      <div class="section-body" data-group="phantom">${secPhantom}</div>
    </details>

    <details class="section warn">
      <summary><span>Частично доступно на сайте <span class="count-badge">${partialLive.length}</span></span><span class="chev">▶</span></summary>
      <div class="section-body" data-group="partial">${secPartial}</div>
    </details>

  document.getElementById('panel-stocks').innerHTML = html;

  document.getElementById('stockSearch').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('#panel-stocks .item-card').forEach(el => {
      el.style.display = el.dataset.search.includes(q) ? '' : 'none';
    });
  });
}

function ymd(d){ return d.toISOString().slice(0,10); }
function shiftDate(str, days){ const d = new Date(str+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+days); return ymd(d); }
function daysBetweenInclusive(a,b){ return Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z'))/86400000)+1; }
function fmtDateRu(s){ const [y,m,d] = s.split('-'); return `${d}.${m}.${y}`; }

function adsValue(c, key){ return key==='name' ? c.name : c[key]; }
function fmtByType(v, type){
  if(type==='int') return fmtInt(v);
  if(type==='money') return fmtMoney(v);
  if(type==='pct') return fmtPct(v);
  return esc(v);
}

function aggregateCampaigns(fromDate, toDate){
  return DATA.ads.campaigns.map(c => {
    let views=0,clicks=0,atbs=0,orders=0,spend=0,revenue=0;
    for(const d of c.days){
      if(d.date>=fromDate && d.date<=toDate){
        views+=d.views; clicks+=d.clicks; atbs+=d.atbs; orders+=d.orders; spend+=d.spend; revenue+=d.revenue;
      }
    }
    return {
      advertId:c.advertId, name:c.name, views, clicks, atbs, orders, spend, revenue,
      ctr: views ? +(clicks/views*100).toFixed(2) : null,
      cpc: clicks ? +(spend/clicks).toFixed(2) : null,
      cart_rate: clicks ? +(atbs/clicks*100).toFixed(2) : null,
      cost_per_cart: atbs ? +(spend/atbs).toFixed(2) : null,
      order_rate: atbs ? +(orders/atbs*100).toFixed(2) : null,
      cost_per_order: orders ? +(spend/orders).toFixed(2) : null,
      drr: revenue ? +(spend/revenue*100).toFixed(2) : null,
    };
  });
}

function computeTotals(rows){
  const t = {views:0,clicks:0,atbs:0,orders:0,spend:0,revenue:0};
  rows.forEach(r => { t.views+=r.views; t.clicks+=r.clicks; t.atbs+=r.atbs; t.orders+=r.orders; t.spend+=r.spend; t.revenue+=r.revenue; });
  t.ctr = t.views ? +(t.clicks/t.views*100).toFixed(2) : null;
  t.cpc = t.clicks ? +(t.spend/t.clicks).toFixed(2) : null;
  t.cart_rate = t.clicks ? +(t.atbs/t.clicks*100).toFixed(2) : null;
  t.cost_per_cart = t.atbs ? +(t.spend/t.atbs).toFixed(2) : null;
  t.order_rate = t.atbs ? +(t.orders/t.atbs*100).toFixed(2) : null;
  t.cost_per_order = t.orders ? +(t.spend/t.orders).toFixed(2) : null;
  t.drr = t.revenue ? +(t.spend/t.revenue*100).toFixed(2) : null;
  return t;
}

function renderAds(){
  if(!adsRange){ adsRange = {from: DATA.ads.yesterday, to: DATA.ads.yesterday}; }
  const {from, to} = adsRange;
  const minDate = DATA.ads.period_fetched.start;
  const maxDate = DATA.ads.period_fetched.end;

  const rows = aggregateCampaigns(from, to);
  const spanDays = daysBetweenInclusive(from, to);
  const prevTo = shiftDate(from, -1);
  const prevFrom = shiftDate(prevTo, -(spanDays-1));
  const prevRows = aggregateCampaigns(prevFrom, prevTo);
  const prevMap = Object.fromEntries(prevRows.map(r => [r.advertId, r]));
  rows.forEach(r => {
    const p = prevMap[r.advertId];
    r.spend_delta_pct = (p && p.spend) ? +((r.spend-p.spend)/p.spend*100).toFixed(1) : null;
    r.drr_delta = (r.drr!==null && p && p.drr!==null) ? +(r.drr-p.drr).toFixed(2) : null;
  });

  const t = computeTotals(rows);
  const pt = computeTotals(prevRows);
  const drrDelta = (t.drr!==null && pt.drr!==null) ? +(t.drr-pt.drr).toFixed(2) : null;
  const spendDelta = pt.spend ? +((t.spend-pt.spend)/pt.spend*100).toFixed(1) : null;

  const periodLabel = from===to ? fmtDateRu(from) : `${fmtDateRu(from)} — ${fmtDateRu(to)}`;

  const kpis = `
    <div class="kpi-row">
      <div class="kpi"><div class="num tabular">${fmtMoney(t.spend)}</div><div class="label">расход ${pill(spendDelta,'%')}</div></div>
      <div class="kpi"><div class="num tabular">${fmtMoney(t.revenue)}</div><div class="label">выручка по рекламе</div></div>
      <div class="kpi ${t.drr>8?'bad':(t.drr>5?'warn':'good')}"><div class="num tabular">${fmtPct(t.drr)}</div><div class="label">ДРР ${pill(drrDelta,' п.п.')}</div></div>
      <div class="kpi"><div class="num tabular">${fmtInt(t.views)}</div><div class="label">показы</div></div>
      <div class="kpi"><div class="num tabular">${fmtInt(t.clicks)}</div><div class="label">клики</div></div>
      <div class="kpi"><div class="num tabular">${fmtInt(t.atbs)}</div><div class="label">добавили в корзину</div></div>
      <div class="kpi"><div class="num tabular">${fmtInt(t.orders)}</div><div class="label">заказов по рекламе</div></div>
      <div class="kpi"><div class="num tabular">${fmtPct(t.cart_rate)}</div><div class="label">CR клик → корзина</div></div>
      <div class="kpi"><div class="num tabular">${fmtPct(t.order_rate)}</div><div class="label">CR корзина → заказ</div></div>
      <div class="kpi"><div class="num tabular">${fmtMoney(t.cost_per_cart)}</div><div class="label">цена корзины</div></div>
      <div class="kpi"><div class="num tabular">${fmtMoney(t.cost_per_order)}</div><div class="label">цена заказа</div></div>
    </div>
    <div class="cat-sub">Показан период: <b>${periodLabel}</b> (${spanDays} дн). Сравнение — с предыдущими ${spanDays} дн (${fmtDateRu(prevFrom)} — ${fmtDateRu(prevTo)}).</div>
  `;

  const headCells = AD_COLUMNS.map(col => {
    const isNum = col.type !== 'text';
    const active = adsSort.key === col.key;
    const arrow = active ? (adsSort.dir==='desc' ? ' ↓' : ' ↑') : '';
    return `<th class="${isNum?'num ':''}sortable${active?' active':''}" data-key="${col.key}" tabindex="0" role="button">${col.label}${arrow}</th>`;
  }).join('');

  const html = kpis + `
    <div class="date-controls">
      <div class="date-presets">
        <button type="button" class="preset-btn" data-preset="yesterday">Вчера</button>
        <button type="button" class="preset-btn" data-preset="7">7 дней</button>
        <button type="button" class="preset-btn" data-preset="30">30 дней</button>
      </div>
      <label>с <input type="date" id="adsFrom" value="${from}" min="${minDate}" max="${maxDate}"></label>
      <label>по <input type="date" id="adsTo" value="${to}" min="${minDate}" max="${maxDate}"></label>
    </div>
    <div class="search-box"><input type="text" id="adsSearch" placeholder="Поиск по кампании…"></div>
    <div class="table-wrap">
      <table>
        <caption>Клик по заголовку колонки сортирует таблицу по этому показателю (повторный клик — меняет направление). Стрелки в ячейках — изменение к предыдущему периоду той же длины.</caption>
        <thead><tr>${headCells}</tr></thead>
        <tbody id="adsBody"></tbody>
      </table>
    </div>
  `;
  document.getElementById('panel-ads').innerHTML = html;

  document.querySelectorAll('#panel-ads th.sortable').forEach(th => {
    const applySort = () => {
      const key = th.dataset.key;
      if(adsSort.key === key){
        adsSort.dir = adsSort.dir === 'desc' ? 'asc' : 'desc';
      } else {
        adsSort = {key, dir: key==='name' ? 'asc' : 'desc'};
      }
      renderAds();
    };
    th.addEventListener('click', applySort);
    th.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); applySort(); }
    });
  });

  document.getElementById('adsFrom').addEventListener('change', (e) => {
    adsRange = {from: e.target.value, to: (e.target.value > adsRange.to) ? e.target.value : adsRange.to};
    renderAds();
  });
  document.getElementById('adsTo').addEventListener('change', (e) => {
    adsRange = {from: (e.target.value < adsRange.from) ? e.target.value : adsRange.from, to: e.target.value};
    renderAds();
  });
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = btn.dataset.preset;
      const end = DATA.ads.yesterday;
      const start = p==='yesterday' ? end : shiftDate(end, -(parseInt(p,10)-1));
      adsRange = {from: start, to: end};
      renderAds();
    });
  });

  document.getElementById('adsSearch').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('#adsBody tr').forEach(el => {
      el.style.display = el.dataset.search.includes(q) ? '' : 'none';
    });
  });

  renderAdsRows(rows);
}

function renderAdsRows(rows){
  const sorted = [...rows].sort((a,b) => {
    let va = adsValue(a, adsSort.key), vb = adsValue(b, adsSort.key);
    if(adsSort.key === 'name') return adsSort.dir==='asc' ? String(va).localeCompare(vb,'ru') : String(vb).localeCompare(va,'ru');
    va = va===null||va===undefined ? -Infinity : va;
    vb = vb===null||vb===undefined ? -Infinity : vb;
    return adsSort.dir==='asc' ? va - vb : vb - va;
  });

  const html = sorted.map(c => {
    const cells = AD_COLUMNS.map(col => {
      const v = adsValue(c, col.key);
      if(col.key === 'name'){
        return `<td class="rowname">${esc(c.name)}<div class="rowsub">ID ${c.advertId}</div></td>`;
      }
      let cls = 'num';
      if(col.drrColor && v!==null){
        cls += ' ' + (v>8?'drr-bad':(v>5?'drr-warn':'drr-good'));
      }
      const deltaPill = col.hasDelta ? pill(c[col.hasDelta], col.type==='money'?'%':' п.п.') : '';
      return `<td class="${cls}">${fmtByType(v, col.type)} ${deltaPill}</td>`;
    }).join('');
    return `<tr data-search="${esc((c.advertId+' '+c.name).toLowerCase())}">${cells}</tr>`;
  }).join('');

  document.getElementById('adsBody').innerHTML = html;
}

/* ---------- КОНКУРЕНТЫ ---------- */
const MONTH_NAMES = {'01':'Янв','02':'Фев','03':'Мар','04':'Апр','05':'Май','06':'Июн','07':'Июл','08':'Авг','09':'Сен','10':'Окт','11':'Ноя','12':'Дек'};

function renderCompetitors(){
  const cats = DATA.competitors.categories;
  if(!cats.length){
    document.getElementById('panel-comp').innerHTML = '<div class="empty-msg">Категории для отслеживания ещё не заданы.</div>';
    return;
  }
  const blocks = cats.map(cat => {
    const seasonal = cat.seasonality_index_by_month || {};
    const months = Object.keys(seasonal).sort();
    const maxV = Math.max(1, ...Object.values(seasonal).map(v=>v||0));
    const curMonth = new Date().toISOString().slice(5,7);
    const bars = months.map(m => {
      const v = seasonal[m]||0;
      const h = Math.max(3, Math.round(v/maxV*76));
      return `<div class="season-bar ${m===curMonth?'now':''}" style="height:${h}px" title="${MONTH_NAMES[m]}: ${v}% от среднего"></div>`;
    }).join('');
    const labels = months.map(m => `<span>${MONTH_NAMES[m]}</span>`).join('');

    const ownRows = (cat.own_items||[]).slice(0,10).map(o => `<tr>
      <td class="rowname">${o.rank}. ${esc(o.name)}<div class="rowsub">${esc(skuLabelByNm(o.nm))}</div></td>
      <td class="num">${fmtMoney(o.price)}</td>
      <td class="num">${fmtMoney(o.revenue)}</td>
      <td class="num">${fmtInt(o.sales)}</td>
    </tr>`).join('') || '<tr><td colspan="4" class="empty-msg">Свои товары не найдены в топе категории.</td></tr>';

    const compRows = (cat.top_competitors||[]).map(c => `<tr>
      <td class="rowname">#${c.rank} ${esc(c.brand||c.seller||'—')}<div class="rowsub">${esc(c.seller||'')}</div></td>
      <td class="num">${fmtMoney(c.price)}</td>
      <td class="num">${fmtMoney(c.revenue)}</td>
      <td class="num">${fmtInt(c.sales)}</td>
    </tr>`).join('') || '<tr><td colspan="4" class="empty-msg">Нет данных.</td></tr>';

    return `<div class="cat-block">
      <h3>${esc(cat.path)}</h3>
      <div class="cat-sub">Тренд категории м/м: ${pill(cat.trend_delta_pct_mom,'%')} &nbsp;·&nbsp; своих товаров в топ-300 категории: ${(cat.own_items||[]).length}</div>

      <div class="season-chart">${bars}</div>
      <div class="season-labels">${labels}</div>
      <div class="cat-sub" style="margin-top:2px;">Сезонность: индекс выручки категории по месяцам (100% = средний месяц, по данным MPStats за последние годы).</div>

      <table style="margin-top:14px;">
        <caption>Ваши товары в топе категории по выручке</caption>
        <thead><tr><th>Товар (место)</th><th class="num">Цена</th><th class="num">Выручка 30дн</th><th class="num">Продажи</th></tr></thead>
        <tbody>${ownRows}</tbody>
      </table>

      <table style="margin-top:16px;">
        <caption>Топ конкурентов по выручке (без учёта своих)</caption>
        <thead><tr><th>Бренд / продавец</th><th class="num">Цена</th><th class="num">Выручка 30дн</th><th class="num">Продажи</th></tr></thead>
        <tbody>${compRows}</tbody>
      </table>
    </div>`;
  }).join('');

  document.getElementById('panel-comp').innerHTML = blocks;
}

/* ---------- АУДИТ РК (из ежедневного xlsx) ---------- */
const AUDIT_SHEET_ORDER = [
  'rk_by_type', 'products', 'funnel_by_sku', 'cannibalization',
  'clusters', 'key_recommendations', 'minus_phrases',
];
let auditActiveSheet = null;

function fmtAuditCell(v, header){
  if(v===''||v===null||v===undefined) return '';
  if((header==='advertId' || header==='РК') && typeof v==='number') return String(v);
  if((header==='nmId' || header==='nmID' || header==='Товар') && typeof v==='number') return esc(skuLabelByNm(v));
  if(typeof v === 'number'){
    if(header.indexOf('₽')!==-1) return Math.round(v).toLocaleString('ru-RU') + ' ₽';
    if(header.indexOf('%')!==-1) return (Number.isInteger(v)?v:v.toFixed(1)) + '%';
    return v.toLocaleString('ru-RU');
  }
  return esc(String(v));
}

function renderAudit(){
  const audit = DATA.ads_audit;
  if(!audit){
    document.getElementById('panel-audit').innerHTML =
      '<div class="empty-msg">Данных пока нет — пришлите свежий xlsx-аудит рекламы, чтобы я его подключила.</div>';
    return;
  }

  const s = audit.summary || {kpis:[], type_breakdown:[], actions:[]};
  const kpiHtml = s.kpis.map(k => {
    const isMoney = /₽/.test(k.label);
    const isPct = /%/.test(k.label);
    let val = k.value;
    val = isMoney ? fmtMoney(val) : (isPct ? fmtPct(val) : fmtInt(val));
    const cls = (isPct && typeof k.value==='number' && k.value<0) ? 'bad' : '';
    return `<div class="kpi ${cls}"><div class="num tabular">${val}</div><div class="label">${esc(k.label)}</div></div>`;
  }).join('');

  const typeHtml = s.type_breakdown.map(t => `
    <div class="type-card">
      <b>${esc(t.type)}</b>
      <span class="muted-text">${esc(t.spend_note||'')}</span>
      <span class="muted-text">${esc(t.drr_note||'')}</span>
    </div>`).join('');

  let lastSection = null;
  const actionsHtml = s.actions.map(a => {
    let sectionHtml = '';
    if(a.section !== lastSection){
      sectionHtml = `<div class="action-section">${esc(a.section||'')}</div>`;
      lastSection = a.section;
    }
    return sectionHtml + `
      <div class="action-item">
        <span class="prio-badge ${a.priority}">${a.priority}</span>
        <div>
          <div class="action-text">${esc(a.text)}</div>
          <div class="action-related">См.: ${esc(a.related||'')}</div>
        </div>
      </div>`;
  }).join('');

  if(!auditActiveSheet) auditActiveSheet = AUDIT_SHEET_ORDER.find(k => audit.sheets[k]) || null;

  const subtabsHtml = AUDIT_SHEET_ORDER.filter(k => audit.sheets[k]).map(k => {
    const sheet = audit.sheets[k];
    return `<button type="button" class="subtab-btn${k===auditActiveSheet?' active':''}" data-sheet="${k}">${esc(sheet.title)} <span class="count-badge" style="margin-left:4px;">${sheet.rows.length}</span></button>`;
  }).join('');

  document.getElementById('panel-audit').innerHTML = `
    <div class="cat-sub" style="margin-bottom:14px;">Источник: ${esc(audit.source_file||'')}. Обновляется вручную — пришлите новый файл, и я пересоберу эту вкладку.</div>
    <div class="audit-kpi-row">${kpiHtml}</div>
    <div class="type-breakdown">${typeHtml}</div>
    <h2 class="section-title" style="font-size:16px;">Главное — что делать</h2>
    ${actionsHtml}
    <div class="subtabs">${subtabsHtml}</div>
    <div class="search-box"><input type="text" id="auditSearch" placeholder="Поиск по таблице…"></div>
    <div id="auditSheetContainer"></div>
  `;

  document.querySelectorAll('.subtab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      auditActiveSheet = btn.dataset.sheet;
      document.querySelectorAll('.subtab-btn').forEach(b => b.classList.toggle('active', b===btn));
      renderAuditSheet();
      document.getElementById('auditSearch').value = '';
    });
  });
  document.getElementById('auditSearch').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('#auditSheetContainer tbody tr').forEach(el => {
      el.style.display = el.dataset.search.includes(q) ? '' : 'none';
    });
  });

  renderAuditSheet();
}

function renderAuditSheet(){
  const audit = DATA.ads_audit;
  const sheet = audit.sheets[auditActiveSheet];
  const container = document.getElementById('auditSheetContainer');
  if(!sheet){ container.innerHTML = '<div class="empty-msg">Нет данных.</div>'; return; }

  const numericCol = sheet.columns.map((_, i) => typeof (sheet.rows[0]||[])[i] === 'number');

  const head = sheet.columns.map((c,i) => `<th class="${numericCol[i]?'num':''}">${esc(c)}</th>`).join('');
  const body = sheet.rows.map(row => {
    const cells = row.map((v,i) => `<td class="${numericCol[i]?'num':''}">${fmtAuditCell(v, sheet.columns[i])}</td>`).join('');
    const searchStr = row.join(' ').toLowerCase();
    return `<tr data-search="${esc(searchStr)}">${cells}</tr>`;
  }).join('');

  container.innerHTML = `
    <div class="table-wrap table-scroll">
      <table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
    </div>`;
}

renderStocks();
renderAds();
renderCompetitors();
renderAudit();

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});
</script>
